jdv2_source_checkpoint: ../GDTS/output/eth/saved_models/best_model.pt
jdv2_source_checkpoint_hash: 126acf2a34f52986c536c397fe3acb04c769a3cde95077461d7971a1b0792950

amp_enabled: true
amp_dtype: bf16
seed: 2035
validation_seed: 2035
num_test_runs: 5
reproducibility: true
shuffle_test_batches: false
data_augmentation: false
num_workers: 0
model_selection_split: dataset_valid
final_test_split: heldout_test
