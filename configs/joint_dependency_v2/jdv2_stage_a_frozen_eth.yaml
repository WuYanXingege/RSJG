dataset: eth5
test_set: eth
phase: test
run_name: jdv2_stage_a_frozen_eth

goal_model_type: joint_dependency_v2
training_stage: joint_goal
jdv2_latent_objective: strict_no_z
use_scene_latent: false
use_dynamic_relation: true
use_joint_energy: true
use_dependency_corrector: true
use_social_encoder: true

# strict_no_z has zero active scene modes. The parser-side constructor
# constant remains 4 for checkpoint/config compatibility but is disabled.
jdv2_scene_modes: 4
jdv2_relation_modes: 4
num_relation_modes: 4
num_goal_candidates: 21
num_samples: 20
num_joint_samples: null
jdv2_energy_rank: 8
goal_pair_rank: 8
social_feature_dim: 128
social_attention_layers: 1

jdv2_refinement_policy: exact_lexicographic_persistent_tie
num_refinement_steps: 2
joint_sampling_mode: sample
joint_sampling_strategy: coverage
joint_sampling_temperature: 1.0
goal_candidate_prior: heatmap
goal_candidate_temperature: 1.0
use_ttst: true

graph_type: radius_ttc
graph_radius: 6.0
ttc_threshold: 8.0
adaptive_graph: false
pair_energy_normalization: mean
energy_weight: 1.0
trajectory_dt: 0.4

# Existing frozen GDTS diffusion/tree settings.
ddpm_step: 100
ddim_step: 20
trunk_stage_step: 30
down_factor: 8
freeze_upstream_generator: true
trajectory_coupling: none

# Portable repository-relative cache provenance.
batch_cache_root: outputs/joint_dependency_v2/cache/source_batches
jdv2_cache_root: outputs/joint_dependency_v2/cache/eth_full_stage_a
jdv2_cache_schema: jdv2-cache-v1
jdv2_cache_source_commit: 4b75110a571e6fd200938ff951a3a218ca4eb1e8
