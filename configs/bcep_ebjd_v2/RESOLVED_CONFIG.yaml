schema: bcep-ebjd-v2-resolved-v1
allow_real_training: false
fold_order:
- zara2
- zara1
- hotel
- univ
- eth
provider:
  density:
    flow_layers: 4
    temporal_layers: 2
    context_dim: 128
    dropout: 0.0
    final_horizon: 12
    auxiliary_horizons:
    - 4
    - 8
    auxiliary_weight: 0.25
    logical_batch_scenes: 4
    objective_weighting: valid_agent_mean_per_logical_batch
    optimizer: AdamW
    lr: 0.0001
    weight_decay: 0.0001
    no_decay_bias_and_normalization: true
    grad_clip_norm: 1.0
    scheduler:
      type: ReduceLROnPlateau
      mode: min
      monitor: dev_nll_final_agent_micro
      factor: 0.5
      patience: 3
      min_lr: 1.0e-06
    max_epochs: 100
    min_completed_epochs: 20
    early_stop_patience: 15
    selection_metric: dev_nll_final_agent_micro
  base_candidates:
    support_count: 256
    candidate_count: 20
    selector: existing_verified_kmeans20
    candidate_coordinate_unit: m
    preserve_existing_selector_settings: true
    train_views_per_window: 2
    observed_only: true
  candidate_head:
    enabled: true
    base_frozen_during_head_training: true
    input_dim: 259
    embedding_widths:
    - 128
    - 64
    set_aggregation: mean
    readout_widths:
    - 64
    - 2
    activation: SiLU
    final_projection_zero_init: true
    candidate_index_embedding: false
    correction_radius_m: 0.5
    residual_bound: rho_u_div_1_plus_l2_norm_u
    objective: hard_best_of_20_euclidean_world_m
    displacement_penalty: squared_world_displacement_div_2rho
    displacement_weight: 0.1
    logical_batch_scenes: 4
    optimizer: AdamW
    lr: 0.0005
    weight_decay: 0.0001
    grad_clip_norm: 1.0
    scheduler:
      type: ReduceLROnPlateau
      mode: min
      monitor: dev_minfde20_agent_micro
      factor: 0.5
      patience: 2
      min_lr: 1.0e-06
    max_epochs: 20
    min_completed_epochs: 5
    early_stop_patience: 5
    selection_metric: dev_minfde20_agent_micro
    validation_seeds:
    - 2035
    - 2036
    - 2037
    - 2038
    - 2039
    extra_candidate_losses: false
  spatial_query:
    enabled_when_maps_present: true
    use_original_map_cnn: true
    crop_width_m_at_anchor: 32.0
    crop_pixels_at_anchor: 256
    crop_center: last_observed_world_position
    crop_world_axes: x_columns_y_rows
    original_crop_align_corners_at_anchor: true
    feature_stride_at_anchor: 8
    feature_center_offset_at_anchor: 0
    feature_grid_align_corners: false
    query_geometry_source: verified_versioned_sidecar
    missing_geometry_with_maps: error
    out_of_bounds: learned_missing_vector_plus_valid_flag
    clamp_out_of_bounds_to_valid_edge: false
    reapply_eth_hotel_axis_swap: false
    derive_feature_centers_from_cnn: true
  augmentation:
    geometry: reuse_verified_existing_rotation_reflection
    transform_observed_future_maps_and_candidates_together: true
    recompute_context_and_fmap_after_augmentation: true
    rotate_cached_cnn_feature_as_equivalent: false
    cache_canonical_base_candidates: true
    validation_random_augmentation: false
coupling:
  retain_original_world_query_scorer: true
  enabled: true
  rounds: 1
  hidden_dim: 64
  final_projection_zero_init: true
  neighbor_mode: observed_knn_tie_inclusive
  neighbor_k_nominal: 8
  edge_chunk_size: 128
  sinkhorn_iterations: 20
  assignment_temperature: 1.0
  final_forward: exact_hard_candidate_gather
  backward: coordinate_level_straight_through
  singleton_hard_and_soft_identity: true
  preserve_candidate_multiset: true
  gather_existing_keyed_noise_with_final_assignment: true
  pair_temperature_m: 0.1
  pair_unit_scale_m: 1.0
  pair_weight: 1.0
  pair_objective: scene_mean_normalized_logsumexp_over_world_agent_mean_distance
  extra_hard_pair_training_loss: false
bridge:
  layers: 6
  proposal_eta: 0.0
  retain_existing_diffusion_and_geometry_losses: true
  clean_path_aux:
    enabled: true
    weight: 0.05
    radial_smooth_l1_beta_m: 0.5
    unit_scale_m: 1.0
    time_indices: interior_future_frames
    noise_weight: signal_coefficient_squared
    aggregation: scene_macro
    extra_denoiser_forwards: 0
    extra_ddim_rollouts: 0
    label: gt_endpoint_conditioned_clean_path_reconstruction
  full_candidate_rollout: false
  gt_endpoint_warp: false
joint:
  schema: bcep-sixlayer-random-downstream-v1
