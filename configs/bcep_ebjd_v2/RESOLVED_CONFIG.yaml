  fjab_blocks: 6
  history_social_blocks: 2
  crop_width_m: 32.0
  map_agent_chunk: 8
  precision: fp32
  proposal_eta: 0
  rollout: false
  projection: false
  batch_scenes: 4
  gradient_accumulation: 4
  weight_decay: 0.0001
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  clip_norm: 5.0
  base_lr: 0.0001
  warmup_epochs: 5
  scheduler_horizon: 100
  max_epochs: 100
  downstream_seed: 3201
  steps: 20
  worlds: 20
  allow_real_training: false
  min_completed_epochs: 30
  patience: 15
  session_seconds: null
  grouped_training: true
  group_max_slots: 32
  selection_mode: H
  tail_flush: 'original: final partial accumulation divides by4, not by pending microbatch
    count'
